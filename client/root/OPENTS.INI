; Where this distribution keeps its game data.
;
; These are the folders the game searches, in this order, after its own
; directory. The first three are what it would assume anyway; the two after
; them are not, and have to be named here because a listed folder is searched
; but the folders inside it are not.
;
; The maps are split so that a player browsing them can tell a campaign
; mission from a map meant to be played against other people. `Maps` itself
; stays on the list so that a map dropped straight into it is still found.

[Paths]
SearchPaths=INI,MIX,Maps,Maps/Missions,Maps/Multiplayer
