; OpenTS as a game of its own on CnCNet.
;
; The client carries a built-in list of the games it knows, and LocalGame= in
; ClientDefinitions.ini names one of them. Left as Tiberian Sun, an OpenTS
; client would register as that game, list among its lobbies and try to join
; matches it cannot play with. This adds OpenTS to the list instead, with lobby
; channels of its own, so its players see each other and nobody else.
;
; InternalName is at most four characters and has to differ from every other
; game's: the client refuses to start otherwise. It is `ots` rather than
; `opents` for that reason, and LocalGame= has to say the same.

[CustomGames]
0=OTS

[OTS]
InternalName=ots
UIName=OpenTS
ChatChannel=#cncnet-opents
GameBroadcastChannel=#cncnet-opents-games
ClientExecutableName=OpenTS.exe
RegistryInstallPath=HKCU\Software\OpenTS
IconFilename=opentsicon.png
